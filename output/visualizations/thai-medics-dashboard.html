  let notice = '';
  const design = {compact:false,radius:12};
  function hydrate(saved){const s=saved?.privateContent;if(!s||s.version!==1)return;['view','office','query','stage','taskTab','currency'].forEach(k=>{if(typeof s[k]==='string')state[k]=s[k]});if(!['overview','patients','calendar','accounts','team','activity'].includes(state.view))state.view='overview';if(!['All offices','Bangladesh','Thailand'].includes(state.office))state.office='All offices';if(!['BDT','THB','USD'].includes(state.currency))state.currency='BDT';if(!['pending','today','overdue','done'].includes(state.taskTab))state.taskTab='pending';state.completed=Array.isArray(s.completed)?s.completed.filter(v=>typeof v==='string'):[];state.stageChanges=s.stageChanges&&typeof s.stageChanges==='object'?s.stageChanges:{};state.notes=s.notes&&typeof s.notes==='object'?s.notes:{};state.addedCases=Array.isArray(s.addedCases)?s.addedCases.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&typeof p.phone==='string'&&['Bangladesh','Thailand'].includes(p.office)&&['BDT','THB','USD'].includes(p.currency)&&Number.isInteger(p.stage)&&p.stage>=0&&p.stage<=8&&typeof p.coordinator==='string'&&typeof p.hospital==='string'&&typeof p.department==='string'&&Number.isFinite(p.billed)&&Number.isFinite(p.paid)).slice(0,10):[];state.addedTasks=Array.isArray(s.addedTasks)?s.addedTasks.filter(v=>v&&typeof v.id==='string'&&typeof v.title==='string'&&typeof v.caseId==='string'&&typeof v.due==='string'&&typeof v.owner==='string').slice(0,15):[];state.activity=Array.isArray(s.activity)?s.activity.filter(v=>typeof v==='string').slice(0,20):[];state.page=1;}
  function save(){const privateContent={...state,notes:Object.fromEntries(Object.entries(state.notes).map(([key,values])=>[key,Array.isArray(values)?[...values]:[]])),activity:[...state.activity].slice(0,20),version:1,selected:null,form:null,resetConfirm:false};while(new TextEncoder().encode(JSON.stringify(privateContent)).length>14000){const key=Object.keys(privateContent.notes).find(key=>privateContent.notes[key].length);if(key)privateContent.notes[key].shift();else if(privateContent.activity.length)privateContent.activity.pop();else break;}const patients=allPatients();if(window.openai?.setWidgetState)Promise.resolve(window.openai.setWidgetState({modelContent:{view:state.view,office:state.office,selectedCase:state.selected,patientCount:patients.length,completedFollowUps:state.completed.length},privateContent})).catch(()=>{});}
  function allPatients(){return [...state.addedCases,...seed].map(p=>({...p,stage:Number.isInteger(state.stageChanges[p.id])&&state.stageChanges[p.id]>=0&&state.stageChanges[p.id]<=8?state.stageChanges[p.id]:p.stage}));}
  const scoped = () => allPatients().filter(p=>state.office==='All offices'||p.office===state.office);
  const allTasks = () => [...state.addedTasks,...taskSeed];
  const scopedTasks = () => {const ids=new Set(scoped().map(p=>p.id));return allTasks().filter(t=>ids.has(t.caseId));};
  function filtered(){const q=state.query.toLowerCase().trim(),phone=q.replace(/[\s+()-]/g,'');return scoped().filter(p=>(!q||`${p.name} ${p.id} ${p.phone} ${p.hospital}`.toLowerCase().includes(q)||(phone&&p.phone.replace(/[\s+()-]/g,'').includes(phone)))&&(!state.stage||(state.stage==='active'?p.stage<8:p.stage===Number(state.stage))));}
  const stagePill = p => '<span class="tm-pill '+(p.stage===8||p.stage===7?'green':p.stage===4?'amber':p.stage===2||p.stage===3?'blue':'')+'">'+stageNames[p.stage]+'</span>';
  function taskRow(t){const p=allPatients().find(p=>p.id===t.caseId),done=state.completed.includes(t.id);return '<div class="tm-task '+(done?'done':'')+'"><input type="checkbox" data-task="'+esc(t.id)+'" aria-label="'+(done?'Reopen ':'Complete ')+esc(t.title)+'" '+(done?'checked':'')+'><div><p>'+esc(t.title)+'</p><small><button class="tm-link" data-action="case" data-id="'+esc(t.caseId)+'">'+esc(p?.name||t.caseId)+'</button> · '+esc(t.owner.split(' ')[0])+'</small></div><span class="tm-pill '+(done?'green':'amber')+'">'+(done?'Done':t.due<today?'Overdue':t.due===today?'Today':dateLabel(t.due))+'</span></div>';}
  function appointmentRow(p){return '<button class="tm-appointment" data-action="case" data-id="'+p.id+'"><span class="tm-date"><small>'+new Date(p.appointment+'T12:00:00Z').toLocaleDateString('en-GB',{month:'short',timeZone:'UTC'})+'</small><strong>'+Number(p.appointment.slice(-2))+'</strong></span><span>'+esc(p.name)+'<small>'+esc(p.hospital)+'</small><small>'+esc(p.department)+' · '+esc(p.time)+' Bangkok</small></span>'+icon('arrow-up-right')+'</button>';}
  function table(){const list=filtered(),pages=Math.max(1,Math.ceil(list.length/6));state.page=Math.min(state.page,pages);return '<section class="tm-panel"><div class="tm-panelhead"><div><h2>Patient cases <span class="tm-pill">'+list.length+'</span></h2><small>A shared view of everyone in your care.</small></div><button class="tm-link" data-action="new-case">'+icon('plus')+'New case</button></div><div class="tm-filters"><label class="tm-search">'+icon('search')+'<input id="tm-search" data-control="search" aria-label="Search patient cases" placeholder="Search name, case ID, phone…" value="'+esc(state.query)+'"></label><select class="tm-select" data-control="stage" aria-label="Case stage"><option value="">All stages</option><option value="active" '+(state.stage==='active'?'selected':'')+'>Active cases only</option>'+stageNames.map((name,i)=>'<option value="'+i+'" '+(state.stage===String(i)?'selected':'')+'>'+name+'</option>').join('')+'</select>'+(state.query||state.stage?'<button class="tm-link" data-action="clear">Reset</button>':'')+'</div><div class="tm-tablewrap"><table><thead><tr><th scope="col">Patient</th><th scope="col">Hospital / specialty</th><th scope="col">Stage</th><th scope="col">Coordinator</th></tr></thead><tbody>'+list.slice((state.page-1)*6,state.page*6).map(p=>'<tr><td><button class="tm-name" data-action="case" data-id="'+p.id+'"><span class="tm-avatar">'+esc(initials(p.name))+'</span><span>'+esc(p.name)+'<small>'+p.id+'</small></span></button></td><td>'+esc(p.hospital)+'<small>'+esc(p.department)+'</small></td><td>'+stagePill(p)+'</td><td>'+esc(p.coordinator)+'<small>'+esc(p.office)+'</small></td></tr>').join('')+(!list.length?'<tr><td colspan="4" class="tm-empty">No cases match your filters.</td></tr>':'')+'</tbody></table></div><footer class="tm-panel-foot"><span>'+list.length+' cases · Page '+state.page+' of '+pages+'</span><div class="tm-tools"><button class="tm-button" data-action="previous" '+(state.page===1?'disabled':'')+'>'+icon('chevron-left')+'Back</button><button class="tm-button" data-action="next" '+(state.page===pages?'disabled':'')+'>Next'+icon('chevron-right')+'</button></div></footer></section>';}
  function accounts(){const list=scoped().filter(p=>p.currency===state.currency),billed=list.reduce((s,p)=>s+p.billed,0),paid=list.reduce((s,p)=>s+p.paid,0);return '<section class="tm-panel"><div class="tm-panelhead"><div><h2>The financial picture</h2><small>Internal · each currency stays separate.</small></div><div class="tm-currencies" aria-label="Account currency">'+['BDT','THB','USD'].map(c=>'<button data-action="currency" data-currency="'+c+'" aria-pressed="'+(c===state.currency)+'">'+c+'</button>').join('')+'</div></div><div class="tm-money"><div><small>Total charges</small><strong>'+money(billed,state.currency)+'</strong><small>Including draft estimates</small></div><div><small>Payments received</small><strong style="color:var(--tm-green)">'+money(paid,state.currency)+'</strong><small>Recorded demo payments</small></div><div><small>Patient outstanding</small><strong style="color:var(--tm-rose)">'+money(billed-paid,state.currency)+'</strong><small>Across '+list.length+' patient accounts</small></div></div></section>';}
  function taskPanel(){let tasks=scopedTasks().filter(t=>state.taskTab==='done'?state.completed.includes(t.id):!state.completed.includes(t.id)&&(state.taskTab==='today'?t.due===today:state.taskTab==='overdue'?t.due<today:t.due<=today));return '<section class="tm-panel"><div class="tm-panelhead"><div><h2>A little follow-through</h2><small>The next steps that keep patients moving.</small></div><button class="tm-button" data-action="new-task" aria-label="Add follow-up">'+icon('plus')+'</button></div><div class="tm-tabs">'+[['pending','Due now'],['today','Today'],['overdue','Overdue'],['done','Done']].map(([key,label])=>'<button data-action="task-tab" data-tab="'+key+'" aria-pressed="'+(key===state.taskTab)+'">'+label+'</button>').join('')+'</div>'+tasks.slice(0,5).map(taskRow).join('')+(!tasks.length?'<div class="tm-empty">All clear. No follow-ups in this view.</div>':'')+'<footer class="tm-panel-foot"><span>'+tasks.length+' follow-ups</span><button class="tm-link" data-action="nav" data-view="calendar">Open calendar'+icon('arrow-right')+'</button></footer></section>';}
  function detail(){const p=allPatients().find(p=>p.id===state.selected);if(!p)return '';const notes=Array.isArray(state.notes[p.id])?state.notes[p.id]:[];return '<section class="tm-details" aria-label="Patient case details"><div class="tm-detailshead"><span class="tm-avatar">'+esc(initials(p.name))+'</span><div><h2>'+esc(p.name)+'</h2><small>'+p.id+'</small></div><button class="tm-button" data-action="close-case" aria-label="Close patient details">'+icon('x')+'</button></div>'+stagePill(p)+'<div class="tm-detailsgrid"><div><small>Phone</small><p>'+esc(p.phone)+'</p></div><div><small>Handling office</small><p>'+esc(p.office)+'</p></div><div><small>Hospital & specialty</small><p>'+esc(p.hospital)+'<small>'+esc(p.department)+'</small></p></div><div><small>Responsible coordinator</small><p>'+esc(p.coordinator)+'</p></div><div><small>Appointment · Bangkok time</small><p>'+(p.appointment?dateLabel(p.appointment)+' · '+p.time:'Not scheduled')+'</p></div><div><small>Patient balance</small><p>'+money(p.billed-p.paid,p.currency)+'</p></div></div><div class="tm-tools"><button class="tm-button tm-primary" data-action="advance" '+(p.stage===8?'disabled':'')+'>'+(p.stage===8?'Completed':'Move to next stage')+icon('arrow-right')+'</button><small>'+esc(p.need||p.department+' consultation, as stated by patient.')+'</small></div><div class="tm-notes"><h3>Communication notes</h3>'+notes.map(n=>'<p>'+esc(n)+'</p>').join('')+'<form class="tm-noteform" data-form="note"><input class="tm-input" name="note" aria-label="New communication note" placeholder="Add a fictional note…" required maxlength="300"><button class="tm-button" type="submit">Save note</button></form></div></section>';}
  function newForm(){if(!state.form)return '';if(state.form==='case')return '<form class="tm-form" data-form="case"><h2>Start a new patient journey</h2><small>Fictional patient information only.</small><div class="tm-formgrid"><label>Patient name<input name="name" class="tm-input" required minlength="2" maxlength="60" placeholder="e.g. Farhana Akter"></label><label>Phone number<input name="phone" class="tm-input" type="tel" required pattern="[+0-9 ()-]{7,20}" placeholder="+880 17XX XXXXXX"></label><label>Office<select class="tm-select" name="office"><option>Bangladesh</option><option>Thailand</option></select></label><label>Coordinator<select class="tm-select" name="coordinator"><option>Nusrat Jahan</option><option>Rahim Uddin</option><option>Somchai S.</option></select></label><label class="tm-full">Medical need, as stated by patient<input name="need" class="tm-input" required minlength="3" maxlength="180" placeholder="What is the patient seeking help with?"></label></div><div class="tm-formactions"><button class="tm-button" data-action="cancel-form" type="button">Cancel</button><button class="tm-button tm-primary" type="submit">Create patient case</button></div></form>';return '<form class="tm-form" data-form="task"><h2>Add a follow-up</h2><div class="tm-formgrid"><label class="tm-full">Task<input name="title" class="tm-input" required minlength="2" maxlength="100" placeholder="Follow up with hospital"></label><label class="tm-full">Patient case<select name="caseId" class="tm-select">'+allPatients().filter(p=>p.stage<8).map(p=>'<option value="'+p.id+'">'+esc(p.name)+' · '+p.id+'</option>').join('')+'</select></label><label>Due date<input class="tm-input" name="due" type="date" value="'+today+'" required></label><label>Assigned to<select name="owner" class="tm-select"><option>Mahi Ahmed</option><option>Nusrat Jahan</option><option>Rahim Uddin</option><option>Somchai S.</option><option>Ploy Anan</option></select></label></div><div class="tm-formactions"><button class="tm-button" data-action="cancel-form" type="button">Cancel</button><button class="tm-button tm-primary" type="submit">Add follow-up</button></div></form>';}
  function overview(){const p=scoped(),tasks=scopedTasks(),open=tasks.filter(t=>!state.completed.includes(t.id)),todayTasks=open.filter(t=>t.due===today).length,late=open.filter(t=>t.due<today).length,appointments=p.filter(p=>p.appointment&&p.appointment>=today&&p.appointment<=offset(30)).sort((a,b)=>(a.appointment+a.time).localeCompare(b.appointment+b.time)),counts=stageNames.map((_,i)=>p.filter(p=>p.stage===i).length);return '<div class="tm-welcome">'+icon('sparkles')+'<div><p>Welcome back, Mahi. Your team is making care happen.</p><small>'+late+' overdue and '+todayTasks+' today’s follow-ups to keep an eye on.</small></div></div><div class="tm-metrics">'+[['Active patient cases',p.filter(p=>p.stage<8).length,'users','active',p.length+' total cases'],['Today’s follow-ups',todayTasks,'check-check','today','Due today'],['Overdue tasks',late,'clock-3','overdue','Need attention'],['Appointments',appointments.length,'calendar-days','appointments','Next 30 days']].map(([label,value,ic,action,note])=>'<button class="tm-metric" data-action="metric" data-metric="'+action+'"><span>'+label+icon(ic)+'</span><strong>'+String(value).padStart(2,'0')+'</strong><small>'+note+'</small></button>').join('')+'</div><section class="tm-panel"><div class="tm-panelhead"><div><h2>The patient journey</h2><small>From first inquiry to a healthy return.</small></div><button class="tm-link" data-action="nav" data-view="patients">View cases'+icon('arrow-up-right')+'</button></div><div class="tm-pipeline">'+stageNames.map((name,i)=>'<button class="tm-step" data-action="stage" data-stage="'+i+'" aria-pressed="'+(state.stage===String(i))+'"><strong>'+String(counts[i]).padStart(2,'0')+'</strong><small>'+name+'</small><i><span style="width:'+Math.max(5,counts[i]/Math.max(1,...counts)*100)+'%"></span></i></button>').join('')+'</div></section><div class="tm-columns">'+taskPanel()+'<section class="tm-panel"><div class="tm-panelhead"><div><h2>Coming up next</h2><small>Hospital appointments · Bangkok time</small></div></div>'+appointments.slice(0,3).map(appointmentRow).join('')+(!appointments.length?'<div class="tm-empty">No upcoming appointments.</div>':'')+'<footer class="tm-panel-foot"><span>'+appointments.length+' appointments</span><button class="tm-link" data-action="nav" data-view="calendar">View schedule'+icon('arrow-right')+'</button></footer></section></div>'+table()+accounts();}
  function calendar(){const tasks=scopedTasks(),appts=scoped().filter(p=>p.appointment&&p.appointment>=today),dates=[...new Set([...tasks.map(t=>t.due),...appts.map(p=>p.appointment)])].sort();return '<section class="tm-panel"><div class="tm-panelhead"><h2>Follow-ups & hospital schedule</h2><button class="tm-link" data-action="new-task">'+icon('plus')+'Add follow-up</button></div><div class="tm-schedule">'+dates.map(d=>'<h3>'+dateLabel(d)+(d===today?' · Today':'')+'</h3>'+tasks.filter(t=>t.due===d).map(taskRow).join('')+appts.filter(p=>p.appointment===d).map(appointmentRow).join('')).join('')+'</div></section>';}
  function team(){return '<section class="tm-panel"><div class="tm-panelhead"><div><h2>One team, two offices</h2><small>Fictional staff directory</small></div></div>'+[['Mahi Ahmed','Operations Manager','Management'],['Rahim Uddin','Patient Coordinator','Bangladesh'],['Nusrat Jahan','Patient Coordinator','Bangladesh'],['Somchai S.','Thailand Coordinator','Thailand'],['Ploy Anan','Hospital Liaison','Thailand'],['Shathi Akter','Accounts Officer','Bangladesh']].map(([name,role,office])=>'<div class="tm-person"><span class="tm-avatar">'+initials(name)+'</span><div>'+name+'<small>'+role+'</small></div><span class="tm-pill green">'+office+'</span></div>').join('')+'</section>';}
  function activityPanel(){return '<section class="tm-panel"><div class="tm-panelhead"><h2>Around the desk</h2></div>'+[...state.activity,'Nusrat confirmed Shirin Akter’s appointment.','Rahim added a note for Abdul Karim.','Shathi recorded a demo payment.'].slice(0,20).map(a=>'<div class="tm-activity">'+esc(a)+'</div>').join('')+'</section>';}
  function render(){const focused=document.activeElement?.id,cursor=focused==='tm-search'?document.activeElement.selectionStart:null;root.querySelectorAll('[data-action="nav"]').forEach(b=>{if(b.dataset.view===state.view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});const label={overview:'Overview',patients:'Patient cases',calendar:'Follow-up calendar',accounts:'Accounts & billing',team:'Team members',activity:'Activity history'}[state.view];root.querySelector('#tm-page-label').textContent=label;root.classList.toggle('tm-compact',design.compact);root.style.setProperty('--tm-radius',design.radius+'px');main.innerHTML='<header class="tm-heading"><div><h1>'+({overview:'Dashboard overview',patients:'Patient cases',calendar:'Your care calendar',accounts:'Accounts & billing',team:'Team members',activity:'Activity history'}[state.view])+'</h1><small>'+dateLabel(today)+' '+year+' · Bangladesh & Thailand</small></div><div class="tm-tools"><select class="tm-select" aria-label="Office" data-control="office">'+['All offices','Bangladesh','Thailand'].map(o=>'<option '+(o===state.office?'selected':'')+'>'+o+'</option>').join('')+'</select><button class="tm-button tm-primary" data-action="new-case">'+icon('plus')+'New patient case</button></div></header>'+(notice?'<div class="tm-notice" role="status">'+esc(notice)+'</div>':'')+newForm()+detail()+(state.view==='overview'?overview():state.view==='patients'?table():state.view==='calendar'?calendar():state.view==='accounts'?accounts()+table():state.view==='team'?team():activityPanel())+'<footer class="tm-bottom"><span>Fictional demo data · '+scoped().length+' patient cases</span><button class="tm-link" data-action="reset">Reset demo</button></footer>'+(state.resetConfirm?'<div class="tm-panel-foot"><span>Restore the original fictional data?</span><div class="tm-tools"><button class="tm-button" data-action="cancel-reset">Cancel</button><button class="tm-button tm-primary" data-action="confirm-reset">Reset</button></div></div>':'');if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});if(focused==='tm-search'){const input=root.querySelector('#tm-search');input?.focus();if(cursor!==null)input?.setSelectionRange(cursor,cursor);}}
  function update(message=''){notice=message;render();save();}
  root.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled||!root.contains(b))return;const action=b.dataset.action;notice='';if(action==='nav'){state.view=b.dataset.view;state.selected=null;state.form=null;state.page=1;}if(action==='case'){state.selected=b.dataset.id;state.form=null;}if(action==='close-case')state.selected=null;if(action==='new-case'){state.form='case';state.selected=null;}if(action==='new-task'){state.form='task';state.selected=null;}if(action==='cancel-form')state.form=null;if(action==='currency')state.currency=b.dataset.currency;if(action==='task-tab')state.taskTab=b.dataset.tab;if(action==='stage'){state.stage=b.dataset.stage;state.view='patients';state.page=1;}if(action==='clear'){state.query='';state.stage='';state.page=1;}if(action==='previous')state.page=Math.max(1,state.page-1);if(action==='next')state.page++;if(action==='metric'){if(b.dataset.metric==='active'){state.view='patients';state.stage='active';state.page=1;}else if(b.dataset.metric==='appointments')state.view='calendar';else{state.taskTab=b.dataset.metric==='today'?'today':'overdue';state.view='overview';}}if(action==='advance'){const p=allPatients().find(p=>p.id===state.selected);if(p&&p.stage<8){state.stageChanges[p.id]=p.stage+1;state.activity.unshift(p.name+' moved to '+stageNames[p.stage+1]+'.');notice='Case stage updated.';}}if(action==='reset')state.resetConfirm=true;if(action==='cancel-reset')state.resetConfirm=false;if(action==='confirm-reset'){state={view:'overview',office:'All offices',query:'',stage:'',taskTab:'pending',currency:'BDT',selected:null,form:null,completed:[],stageChanges:{},notes:{},addedCases:[],addedTasks:[],activity:[],page:1,resetConfirm:false};notice='Original demo data restored.';}update(notice);if(action==='case'||action==='new-case'||action==='new-task')root.querySelector('.tm-details,.tm-form')?.scrollIntoView({behavior:'smooth',block:'nearest'});});
  root.addEventListener('change',event=>{const el=event.target;if(el.dataset.task){const id=el.dataset.task;state.completed=el.checked?[...new Set([...state.completed,id])]:state.completed.filter(v=>v!==id);const task=allTasks().find(t=>t.id===id);if(task)state.activity.unshift((el.checked?'Completed: ':'Reopened: ')+task.title);update(el.checked?'Follow-up completed.':'Follow-up reopened.');}if(el.dataset.control==='office'){state.office=el.value;state.page=1;update();}if(el.dataset.control==='stage'){state.stage=el.value;state.page=1;update();}});
  root.addEventListener('input',event=>{if(event.target.dataset.control==='search'){state.query=event.target.value;state.page=1;update();}});
  root.addEventListener('submit',event=>{const form=event.target;if(!form.dataset.form)return;event.preventDefault();if(!form.reportValidity())return;const values=Object.fromEntries(new FormData(form));if(form.dataset.form==='case'){if(!values.name.trim()||!values.need.trim())return;if(state.addedCases.length>=10){update('Demo limit reached. Reset the demo to add more cases.');return;}if(allPatients().some(p=>p.phone.replace(/\D/g,'')===values.phone.replace(/\D/g,''))){update('A case with this phone number already exists.');return;}const id='TMD-'+year+'-'+String(seed.length+state.addedCases.length+1).padStart(4,'0');state.addedCases.unshift({id,name:values.name.trim(),phone:values.phone,stage:0,office:values.office,coordinator:values.coordinator,hospital:'Not assigned',department:'To be confirmed',need:values.need.trim(),currency:'BDT',billed:0,paid:0,appointment:'',time:''});state.form=null;state.selected=id;state.activity.unshift('Created a patient case for '+values.name.trim()+'.');update('Patient case created: '+id);}else if(form.dataset.form==='task'){if(!values.title.trim())return;if(state.addedTasks.length>=15){update('Demo task limit reached. Reset to start again.');return;}state.addedTasks.unshift({id:'custom-'+Date.now(),title:values.title.trim(),caseId:values.caseId,due:values.due,owner:values.owner});state.form=null;state.activity.unshift('Added follow-up: '+values.title.trim());update('Follow-up added.');}else if(form.dataset.form==='note'){if(!state.selected||!values.note.trim())return;const notes=Array.isArray(state.notes[state.selected])?state.notes[state.selected]:[];state.notes[state.selected]=[...notes,values.note.trim()].slice(-6);state.activity.unshift('Added a communication note to '+state.selected+'.');update('Communication note saved.');}});
  hydrate(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){hydrate(event.detail.globals.widgetState);render();}});
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(design,'compact',{label:'Compact rows'});tweak.addSlider(design,'radius',{label:'Card corners',min:6,max:18,unit:'px'});}
})();
</script>
